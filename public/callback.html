<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLX Auth Success</title>
  <style>
    body {
      font-family: 'Arial';
      background: #f4f6f8;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #241f2f;
    }
    .card {
      background: #ffffff;
      padding: 36px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h2 {
      color: #1d182f;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      color: #4f4067;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .code-box {
      background: #f2f4f5;
      border: 1px solid #d8dde0;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      color: #1e1d21;
      word-break: break-all;
      margin-bottom: 20px;
      text-align: left;
    }
    .btn {
      background: #15151e;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn:hover {
      background: #403a49;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn.success {
      background: #a069df;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Authorization Successful!</h2>
    <p>Copy this authorization code and use it to obtain your <b>Refresh Token</b>:</p>
    
    <div class="code-box" id="codeText">{{CODE}}</div>
    
    <button class="btn" id="copyBtn" onclick="copyCode()">Copy Code</button>
  </div>

  <script>
    function copyCode() {
      const codeText = document.getElementById('codeText').innerText;
      const btn = document.getElementById('copyBtn');
      
      navigator.clipboard.writeText(codeText).then(() => {
        btn.innerText = 'Copied!';
        btn.classList.add('success');
        setTimeout(() => {
          btn.innerText = 'Copy Code';
          btn.classList.remove('success');
        }, 2500);
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    }
  </script>
</body>
</html>
