<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLX Auth Success</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f8;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #121212;
    }
    .card {
      background: #ffffff;
      padding: 36px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 32px;
      fill: #002f34;
      margin-bottom: 20px;
    }
    h2 {
      color: #002f34;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      color: #406367;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .code-box {
      background: #f2f4f5;
      border: 1px solid #d8dde0;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      color: #002f34;
      word-break: break-all;
      margin-bottom: 20px;
      text-align: left;
    }
    .btn {
      background: #002f34;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn:hover {
      background: #00474f;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn.success {
      background: #00843a;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 96 32"><path d="M38.5 0h-6.2v32h6.2V0zM19.5 7.8C12.7 7.8 7.2 13.3 7.2 20.1s5.5 12.3 12.3 12.3 12.3-5.5 12.3-12.3S26.3 7.8 19.5 7.8zm0 18.5c-3.4 0-6.2-2.8-6.2-6.2s2.8-6.2 6.2-6.2 6.2 2.8 6.2 6.2-2.8 6.2-6.2 6.2zM80.2 13.5c-3.4 0-6.2 2.8-6.2 6.2s2.8 6.2 6.2 6.2 6.2-2.8 6.2-6.2-2.8-6.2-6.2-6.2zm0-5.7c6.8 0 12.3 5.5 12.3 12.3s-5.5 12.3-12.3 12.3-12.3-5.5-12.3-12.3 5.5-12.3 12.3-12.3zM0 16h4.1v16H0V16z"/></svg>
    <h2>Authorization Successful!</h2>
    <p>Copy this authorization code and use it to obtain your <b>Refresh Token</b>:</p>
    
    <div class="code-box" id="codeText">{{CODE}}</div>
    
    <button class="btn" id="copyBtn" onclick="copyCode()">Copy Code</button>
  </div>

  <script>
    function copyCode() {
      const codeText = document.getElementById('codeText').innerText;
      const btn = document.getElementById('copyBtn');
      
      navigator.clipboard.writeText(codeText).then(() => {
        btn.innerText = 'Copied!';
        btn.classList.add('success');
        setTimeout(() => {
          btn.innerText = 'Copy Code';
          btn.classList.remove('success');
        }, 2500);
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    }
  </script>
</body>
</html>
